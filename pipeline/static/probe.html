<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surya Answers</title>
<style>
:root { --bg: #eef0f2; --card: #fff; --ink: #1d232a; --muted: #66707a; --line: #d7dce1; --accent: #1f6feb;
        --ar: #0e7a5f; --en: #7a4b0e; --bad: #b42318; }
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
         padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
h1 { font-size: 17px; margin: 0 8px 0 0; font-weight: 600; }
header a { color: var(--accent); text-decoration: none; }
label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
select { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
button { font: inherit; cursor: pointer; border-radius: 6px; }
.small { font-size: 12px; color: var(--muted); }
.layout { display: grid; grid-template-columns: 250px 1fr; block-size: calc(100vh - 53px); }
.list { overflow: auto; border-inline-end: 1px solid var(--line); background: var(--card); }
.list h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 12px 4px; }
.item { display: flex; gap: 8px; align-items: center; padding: 6px 12px; cursor: pointer; border-inline-start: 3px solid transparent; }
.item:hover { background: #f3f5f7; }
.item.on { background: #e8f0fe; border-inline-start-color: var(--accent); }
.item img { inline-size: 44px; block-size: 44px; object-fit: contain; background: #f6f7f8; border: 1px solid var(--line); border-radius: 4px; flex: none; }
.item span { font-size: 12.5px; word-break: break-all; }
.view { display: grid; grid-template-rows: auto auto 1fr; min-block-size: 0; background: var(--card); }
.head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.head h2 { font-size: 15px; margin: 0; }
.chip { font-size: 12px; padding: 1px 7px; border-radius: 10px; background: #eef1f4; color: var(--ink); white-space: nowrap; }
.chip.ar { background: #e3f4ee; color: var(--ar); font-weight: 600; } .chip.en { background: #f7ecdc; color: var(--en); font-weight: 600; }
.chip.warn { background: #fde7e5; color: var(--bad); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.tabs button { border: 1px solid var(--line); background: #fff; padding: 4px 10px; font-size: 13px; }
.tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.tabs button.bad { color: var(--bad); }
.tabs button.on.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.split { display: grid; grid-template-columns: 1fr 1fr; min-block-size: 0; }
.split > div { overflow: auto; min-block-size: 0; }
.page { padding: 10px; background: #f6f7f8; }
.frame { position: relative; }
.frame img { display: block; inline-size: 100%; }
.frame svg { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; pointer-events: none; }
.frame rect { fill: none; stroke: rgba(210, 50, 50, .45); stroke-width: 2; vector-effect: non-scaling-stroke; }
.frame rect.on { fill: rgba(255, 200, 0, .3); stroke: #d23232; stroke-width: 3; }
.answer { border-inline-start: 1px solid #e3e6e9; }
.prompt { padding: 10px 16px; font-size: 12.5px; color: var(--muted); border-block-end: 1px solid #e3e6e9; }
.facts { padding: 8px 16px; font-size: 12.5px; color: var(--muted); border-block-end: 1px solid #e3e6e9; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.facts b { color: var(--ink); font-weight: 600; }
pre { margin: 0; padding: 14px 16px; white-space: pre-wrap; word-break: break-word; unicode-bidi: plaintext; font: 12.5px/1.55 Consolas, monospace; }
.ln { display: block; border-radius: 4px; }
.ln:hover { background: #fff3c4; }
.ln.inl { display: inline; }
.ours { border-block-start: 1px dashed var(--line); }
.ours summary { padding: 8px 16px; cursor: pointer; color: var(--muted); font-size: 12.5px; }
.empty { color: var(--muted); padding: 60px 20px; text-align: center; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; block-size: auto; }
  .list { max-block-size: 240px; }
  .split { grid-template-columns: 1fr; }
  .split > div { overflow: visible; }
}
</style>
</head>
<body>
<header>
  <h1>Surya Answers</h1>
  <a href="/">← Sample Generator</a>
  <label>Show <select id="kind">
    <option value="">all images</option><option value="reference">reference pages</option>
    <option value="page">our pages</option><option value="cut">cut-out blocks</option>
  </select></label>
  <span class="small" id="count"></span>
  <span class="small">Surya OCR 2.5 answers from surya_probe/results.jsonl (one request at a time, 4,096 tokens). Hover a line to see its box.</span>
</header>
<div class="layout">
  <nav class="list" id="list"></nav>
  <section class="view" id="view"><div class="empty">Loading…</div></section>
</div>
<script>
const PROMPTS = {
  full_ocr: "OCR this image to HTML. Each block is a div with data-label and data-bbox (x0 y0 x1 y1, normalized 0-1000).",
  block_ocr: "OCR this block image to HTML.",
  layout: 'Output the layout of this image as JSON. Each entry is a dict with "label", "bbox", and "count" fields. Bbox is x0 y0 x1 y1, normalized 0-1000.',
  table: 'Output the table rows then columns as JSON. Each entry is a dict with "label" ("Row" or "Col") and "bbox" (x0 y0 x1 y1, normalized 0-1000).',
};
const ORDER = ["full_ocr", "block_ocr", "layout", "table", "layout_schema", "table_schema"];
const KINDS = { reference: "Reference pages", page: "Our pages", cut: "Cut-out blocks" };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const $ = (id) => document.getElementById(id);
let DATA = [], current = null, tab = "full_ocr";

// Surya's compact blocks: <|Label|><|x0|><|y0|><|x1|><|y1|>content (<|box|> is a box inside a block, not a block)
const HEAD = /<\|(?!box\|)[A-Za-z][A-Za-z-]*\|>(?:<\|\d{1,4}\|>){4}/g;
function pieces(text) {
  text = text || "";
  const starts = [...text.matchAll(HEAD)].map((m) => m.index);
  if (starts.length) {
    const lead = starts[0] > 0 ? [text.slice(0, starts[0])] : [];
    return { json: false, entries: lead.concat(starts.map((a, i) => text.slice(a, starts[i + 1] ?? text.length))) };
  }
  const json = text.match(/\{[^{}]*\}/g);
  if (json && text.trim().startsWith("[")) return { json: true, entries: json };
  return { json: false, entries: [text] };
}
const boxOf = (l) => (l.match(/^<\|[A-Za-z-]+\|><\|(\d+)\|><\|(\d+)\|><\|(\d+)\|><\|(\d+)\|>/)
                      || l.match(/"bbox": ?"(\d+) (\d+) (\d+) (\d+)"/) || []).slice(1).map(Number);
// tags shown as they are, the text between them isolated so Arabic doesn't reorder the tags around it
const shown = (line) => line.split(/(<[^>]+>)/).map((part, k) => k % 2 ? esc(part) : part ? `<bdi>${esc(part)}</bdi>` : "").join("");

function listing(text) {
  const { json, entries } = pieces(text);
  let n = 0;
  const html = json ? esc(text).replace(/\{[^{}]*\}/g, (m) => `<span class="ln inl" data-i="${n++}">${m}</span>`)
                    : entries.map((l, i) => `<span class="ln" data-i="${i}">${shown(l)}</span>`).join("");
  return { html, boxes: entries.map(boxOf) };
}

function renderList() {
  const kind = $("kind").value;
  const shownItems = DATA.filter((d) => !kind || d.kind === kind);
  $("count").textContent = `${shownItems.length} images`;
  let html = "";
  for (const k of Object.keys(KINDS)) {
    const group = shownItems.filter((d) => d.kind === k);
    if (!group.length) continue;
    html += `<h3>${KINDS[k]} (${group.length})</h3>` + group.map((d) => `<div class="item${d === current ? " on" : ""}" data-image="${esc(d.image)}">
      <img src="/probe/${encodeURIComponent(d.image)}" alt="" loading="lazy"><span>${esc(d.image)}</span></div>`).join("");
  }
  $("list").innerHTML = html || `<div class="empty">No images</div>`;
}

function select(image) {
  current = DATA.find((d) => d.image === image) || null;
  if (current && !current.answers[tab]) tab = ORDER.find((t) => current.answers[t]) || tab;
  renderList();
  renderView();
}

function renderView() {
  const d = current, view = $("view");
  if (!d) { view.innerHTML = `<div class="empty">Pick an image on the left.</div>`; return; }
  const a = d.answers[tab] || {};
  const ok = a.status === 200;
  const { html, boxes } = listing(ok ? a.content : `HTTP ${a.status}: ${a.content || ""}`);
  const ours = tab === "block_ocr" ? d.ours.html : d.ours[tab];
  const base = tab.replace("_schema", "");
  view.innerHTML = `
    <div class="head"><h2>${esc(d.image)}</h2>
      <span class="chip">${esc(KINDS[d.kind] || d.kind)}${d.label ? " · " + esc(d.label) : ""}</span>
      ${d.lang ? `<span class="chip ${esc(d.lang)}">${esc(d.lang)}</span>` : ""}
      ${d.effect ? `<span class="chip">${esc(d.effect)}</span>` : ""}
      <span class="small">${d.size ? esc(d.size.join(" × ")) + " px" : ""}</span></div>
    <div class="tabs">${ORDER.filter((t) => d.answers[t]).map((t) => {
      const bad = d.answers[t].status !== 200 || d.answers[t].finish_reason === "length";
      return `<button data-tab="${t}" class="${t === tab ? "on" : ""}${bad ? " bad" : ""}">${t.replace("_schema", " + schema")}</button>`;
    }).join("")}</div>
    <div class="split">
      <div class="page"><div class="frame"><img src="/probe/${encodeURIComponent(d.image)}" alt="">
        <svg viewBox="0 0 1000 1000" preserveAspectRatio="none">${boxes.map((b, i) => b.length === 4
          ? `<rect data-i="${i}" x="${b[0]}" y="${b[1]}" width="${Math.max(1, b[2] - b[0])}" height="${Math.max(1, b[3] - b[1])}"/>` : "").join("")}</svg>
      </div></div>
      <div class="answer">
        <div class="prompt"><b>Prompt:</b> ${esc(PROMPTS[base])}${tab.endsWith("_schema") ? " <i>(sent with the JSON schema for guided decoding)</i>" : ""}</div>
        <div class="facts"><span>status <b class="${ok ? "" : "warn"}">${esc(a.status)}</b></span>
          <span>${esc(a.seconds)} s</span><span>finish <b>${esc(a.finish_reason ?? "–")}</b></span>
          <span>${esc(a.tokens ?? "–")} / ${esc(a.max_tokens)} tokens</span>
          <span>${boxes.filter((b) => b.length === 4).length} boxes</span></div>
        <pre id="answer">${html}</pre>
        ${ours ? `<details class="ours"><summary>Our label for this image when the probe ran (${esc(tab === "block_ocr" ? "block_ocr" : base)}, the old form from before the probe changed surya.py)</summary><pre>${esc(ours)}</pre></details>` : ""}
      </div>
    </div>`;
}

$("view").addEventListener("click", (e) => {
  const b = e.target.closest("[data-tab]");
  if (b) { tab = b.dataset.tab; renderView(); }
});
for (const [type, on] of [["mouseover", true], ["mouseout", false]]) {
  $("view").addEventListener(type, (e) => {
    const ln = e.target.closest("#answer .ln");
    if (ln) $("view").querySelector(`rect[data-i="${ln.dataset.i}"]`)?.classList.toggle("on", on);
  });
}
$("list").addEventListener("click", (e) => {
  const item = e.target.closest("[data-image]");
  if (item) { select(item.dataset.image); history.replaceState(null, "", "#" + encodeURIComponent(item.dataset.image)); }
});
$("kind").addEventListener("change", renderList);
addEventListener("hashchange", () => select(decodeURIComponent(location.hash.slice(1))));

fetch("/api/probe").then((r) => r.json()).then((data) => {
  DATA = data;
  if (!DATA.length) { $("view").innerHTML = `<div class="empty">No probe answers yet (run surya_probe/probe.py).</div>`; return; }
  select(decodeURIComponent(location.hash.slice(1)) || DATA[0].image);
});
</script>
</body>
</html>
